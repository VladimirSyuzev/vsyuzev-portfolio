name: Deploy to beget

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-beget
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # FTP-синхронизация: заливаются только изменившиеся файлы (состояние
      # хранится в .deploy-state.json на сервере), поэтому после первого
      # большого аплоада деплой идёт секунды.
      - name: Upload out/ to beget
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # beget поддерживает FTPS (explicit TLS) на 21 порту — пароль не
          # уходит открытым текстом. server = <логин>.beget.tech
          protocol: ftps
          port: 21
          server: ${{ secrets.BEGET_FTP_HOST }}
          username: ${{ secrets.BEGET_FTP_USER }}
          password: ${{ secrets.BEGET_FTP_PASSWORD }}
          local-dir: ./out/
          # server-dir относительно домашней папки FTP-аккаунта, со слешем
          # в конце. Напр. /syuzevb1.beget.tech/public_html/
          server-dir: ${{ secrets.BEGET_FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
